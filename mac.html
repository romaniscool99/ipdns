<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IPdns | ipv6</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            margin: 0;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        #ipv6 {
            font-size: 24px;
            font-weight: bold;
            color: #00ffcc;
            margin-bottom: 30px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #66bb6a;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <h1>Your IPv6 Address Is:</h1>
    <div id="ipv6">searching api.ipdns.com</div>
    <button onclick="window.location.href='index.html'">Back to Homepage</button>

    <script>
        async function getIPv6() {
            try {
                const res = await fetch('https://api64.ipify.org?format=json');
                const data = await res.json();
                document.getElementById('ipv6').textContent = data.ip;
            } catch (err) {
                document.getElementById('ipv6').textContent = 'Could not fetch IPv6 address.';
                console.error(err);
            }
        }

        getIPv6();
    </script>
</body>
</html>
