<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPdns | ipv4</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
        }

        h1 {
            font-size: 24px;
        }

        #ip-address {
            font-weight: bold;
            font-size: 28px;
        }

        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            font-size: 20px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
            transition: all 0.3s ease; /* Smooth transition for scaling and color change */
        }

        button:hover {
            background-color: #ADD8E6; /* Lighten the color */
            transform: scale(1.1); /* Slightly enlarge the button */
        }

        /* GIF styling */
        #gif {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 50px;
            height: auto;
        }
    </style>
</head>
<body>
    <h1>Your IPv4 Address is: <span id="ip-address">searching api.ipdns.com</span></h1>

    <!-- Add your GIF here -->
    <img id="gif" src="https://assets.onecompiler.app/43fw98db5/43ggte77w/solos.gif" alt="Loading GIF">

    <!-- Button to go back to the homepage -->
    <button onclick="window.location.href='index.html'">Back to Homepage</button>

    <script>
        // Function to get and display the IP address
        async function getIP() {
            try {
                // Use an external API to get the IP address
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                document.getElementById('ip-address').textContent = data.ip;
            } catch (error) {
                document.getElementById('ip-address').textContent = 'Unable to fetch IP address.';
                console.error('Error fetching IP address:', error);
            }
        }

        // Call the function when the page loads
        getIP();
    </script>
</body>
</html>
